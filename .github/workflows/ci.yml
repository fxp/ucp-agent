name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Type-check both workers (runs on every push & PR) ──────────────────────
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker:
          - cloudflare/agent-worker
          - cloudflare/supply-chain-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.worker }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.worker }}

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: ${{ matrix.worker }}

  # ── Deploy 已退役（2026-06-12）──────────────────────────────────────────────
  # ucp-agent / supply-chain-mock 旧 demo worker 已删除（被新架构 ADR-14 取代：
  # ucp-vending-machine + vending-supply-chain）。此 repo 仅保留 typecheck 作参考，
  # 不再自动部署。如需恢复部署，从 git 历史取回 deploy job。
