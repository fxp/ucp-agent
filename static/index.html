<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCP Vending · AI 购物助手</title>
<script async src="https://pay.google.com/gp/p/js/pay.js" onload="_initGPay()"></script>
<style>
/* ── Reset & base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #0d1117;
  --bg2:       #161b22;
  --bg3:       #21262d;
  --border:    #30363d;
  --text:      #e6edf3;
  --muted:     #8b949e;
  --blue:      #58a6ff;
  --blue-bg:   #1a3a5c;
  --green:     #3fb950;
  --green-bg:  #1a3a1a;
  --yellow:    #e3b341;
  --red:       #f85149;
  --radius:    12px;
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

/* ── Layout ── */
.app     { display: flex; flex-direction: column; height: 100vh; }
header   { display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.logo    { font-size: 20px; }
.title   { font-size: 14px; font-weight: 700; color: var(--blue); }
.badges  { display: flex; gap: 6px; margin-left: 4px; }
.badge   { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
.bb      { background: var(--blue-bg);  color: var(--blue);  }
.bg      { background: var(--green-bg); color: var(--green); }
.by      { background: #3b2f00;         color: var(--yellow);}
.status  { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.dot     { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.thinking { background: var(--yellow); animation: pulse .8s infinite; }
.dot.done     { background: var(--green); }

.body    { display: flex; flex: 1; overflow: hidden; }

/* ── Chat panel ── */
.chat-panel  { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.chat-msgs   { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
.chat-suggestions { padding: 0 16px 12px; display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
.sug         { background: var(--bg2); border: 1px solid var(--border); border-radius: 18px; padding: 5px 14px; font-size: 12px; color: var(--muted); cursor: pointer; transition: .15s; }
.sug:hover   { border-color: var(--blue); color: var(--blue); }
.chat-input  { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 10px; background: var(--bg2); flex-shrink: 0; }
.chat-input textarea { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--text); font-size: 13px; resize: none; font-family: inherit; min-height: 52px; max-height: 120px; }
.chat-input textarea:focus { outline: none; border-color: var(--blue); }
.send-btn    { padding: 0 18px; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; align-self: flex-end; height: 36px; white-space: nowrap; }
.send-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ── Bubble ── */
.msg          { display: flex; gap: 10px; animation: fi .2s ease; max-width: 85%; }
.msg.user     { align-self: flex-end; flex-direction: row-reverse; }
.msg.agent    { align-self: flex-start; }
@keyframes fi { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
.av           { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; margin-top: 2px; }
.msg.user  .av { background: var(--blue-bg);  }
.msg.agent .av { background: var(--green-bg); }
.bubble       { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; }
.msg.user  .bubble { background: var(--blue-bg); border-color: #1f6feb; }
.msg.agent .bubble { }
.bubble-text  { font-size: 13px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
.msg.user  .bubble-text { color: #cae8ff; }
.role-label   { font-size: 10px; font-weight: 700; letter-spacing: .05em; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; }

/* ── Product grid card ── */
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 4px; }
.prod-item    { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 12px; cursor: pointer; transition: .15s; }
.prod-item:hover { border-color: var(--blue); }
.prod-item.unavail { opacity: .5; cursor: default; }
.prod-emoji   { font-size: 28px; text-align: center; margin-bottom: 6px; }
.prod-name    { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
.prod-price   { font-size: 13px; font-weight: 800; color: var(--green); }
.prod-stock   { font-size: 10px; color: var(--red); margin-top: 2px; }
.prod-lane    { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* ── Payment card ── */
.pay-card     { min-width: 280px; max-width: 340px; }
.pay-header   { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.pay-icon     { font-size: 20px; }
.pay-title    { font-size: 14px; font-weight: 700; color: var(--blue); }
.pay-row      { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.pay-total    { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 8px; }
.pay-total-label { font-size: 13px; color: var(--muted); }
.pay-total-amount { font-size: 22px; font-weight: 800; color: var(--text); }
.pay-total-cur    { font-size: 11px; color: var(--muted); margin-left: 3px; }
.ap2-chips    { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
.ap2-chip     { font-size: 10px; padding: 2px 7px; border-radius: 10px; border: 1px solid #1f6feb; color: var(--blue); background: var(--blue-bg); font-weight: 600; }
.pay-methods  { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.btn-method   { width: 100%; padding: 11px; border: none; border-radius: 9px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: .15s; }
.btn-alipay   { background: linear-gradient(135deg, #1677ff, #0958d9); color: #fff; }
.btn-alipay:hover { opacity: .9; }
.btn-gpay     { background: #000; color: #fff; }
.btn-gpay:hover { background: #222; }
.btn-prepaid  { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
.btn-prepaid:hover { border-color: var(--blue); color: var(--blue); }
.btn-cancel   { background: none; color: var(--muted); border: none; font-size: 12px; cursor: pointer; padding: 4px; }
.btn-cancel:hover { color: var(--red); }
.alipay-cashier { border: 1px solid #1f6feb; border-radius: 10px; overflow: hidden; margin-top: 12px; display: none; }
.alipay-cashier.show { display: block; }
.alipay-cashier iframe { width: 100%; height: 380px; border: none; display: block; }

/* ── Order timeline card ── */
.order-card  { min-width: 260px; }
.order-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.order-icon  { font-size: 20px; }
.order-title { font-size: 14px; font-weight: 700; color: var(--green); }
.order-meta  { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.timeline    { display: flex; flex-direction: column; gap: 0; }
.tl-item     { display: flex; align-items: flex-start; gap: 10px; }
.tl-line     { display: flex; flex-direction: column; align-items: center; }
.tl-dot      { width: 10px; height: 10px; border-radius: 50%; background: var(--green); flex-shrink: 0; margin-top: 3px; }
.tl-connector { width: 2px; flex: 1; min-height: 16px; background: var(--border); margin: 2px 0; }
.tl-item:last-child .tl-connector { display: none; }
.tl-name     { font-size: 12px; color: var(--text); font-weight: 600; padding-bottom: 12px; }
.tl-name.fail { color: var(--red); }
.order-id    { font-family: monospace; font-size: 10px; color: var(--muted); margin-top: 8px; word-break: break-all; }

/* ── Protocol log sidebar ── */
.log-panel   { width: 360px; flex-shrink: 0; border-left: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg); }
.log-header  { display: flex; align-items: center; gap: 6px; padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; flex-shrink: 0; }
.log-entries { flex: 1; overflow-y: auto; padding: 8px; }
.log-entry   { margin-bottom: 6px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; animation: fi .2s ease; }
.le-head     { display: flex; align-items: center; gap: 6px; padding: 6px 10px; cursor: pointer; }
.le-head:hover { background: var(--bg2); }
.meth        { font-family: monospace; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; }
.mGET        { background: var(--blue-bg); color: var(--blue); }
.mPOST       { background: var(--green-bg); color: var(--green); }
.mAP2        { background: #3b2f00; color: var(--yellow); }
.mEVENT      { background: #1a1a3a; color: #a78bfa; }
.le-path     { font-family: monospace; font-size: 11px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.le-status   { font-size: 10px; font-weight: 700; }
.ok          { color: var(--green); }
.err         { color: var(--red); }
.calling     { font-size: 9px; padding: 1px 5px; border-radius: 3px; background: #3b2f00; color: var(--yellow); font-family: monospace; font-weight: 700; }
.le-arrow    { color: var(--muted); font-size: 9px; transition: transform .15s; }
.log-entry.open .le-arrow { transform: rotate(90deg); }
.le-body     { display: none; padding: 8px 10px; border-top: 1px solid var(--border); background: #060a10; }
.log-entry.open .le-body { display: block; }
.le-body pre { font-family: monospace; font-size: 10px; color: var(--muted); white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }

.log-status  { padding: 7px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

/* ── Misc ── */
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.typing { display: flex; gap: 4px; padding: 6px 2px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

@media (max-width: 720px) {
  .log-panel { display: none; }
}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <span class="logo">🤖</span>
    <span class="title">UCP Vending · AI 购物助手</span>
    <div class="badges">
      <span class="badge bb">GLM-4</span>
      <span class="badge bg">UCP 2026-04-08</span>
      <span class="badge by">AP2</span>
    </div>
    <div class="status">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">就绪</span>
    </div>
  </header>

  <div class="body">

    <!-- Chat panel -->
    <section class="chat-panel">
      <div class="chat-msgs" id="chat">

        <!-- Welcome message -->
        <div class="msg agent">
          <div class="av">🤖</div>
          <div>
            <div class="bubble">
              <div class="role-label">AI 助手</div>
              <div class="bubble-text">你好！我是 UCP 购物 Agent，由 GLM-4 驱动。

我会通过 UCP 协议帮你完成完整的购物流程：
🔍 浏览商品 → 💳 选择支付方式 → 📦 自动出货

告诉我你想买什么，或浏览下方商品目录。</div>
            </div>
          </div>
        </div>

      </div>

      <!-- Quick suggestions -->
      <div class="chat-suggestions" id="suggestions">
        <div class="sug" onclick="suggest(this)">帮我买一瓶可乐</div>
        <div class="sug" onclick="suggest(this)">来瓶矿泉水</div>
        <div class="sug" onclick="suggest(this)">有什么好喝的饮料？</div>
        <div class="sug" onclick="suggest(this)">帮我买绿茶</div>
      </div>

      <!-- Input bar -->
      <div class="chat-input">
        <textarea id="input" placeholder="告诉 Agent 你想要什么…" rows="2"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
        <button class="send-btn" id="send-btn" onclick="send()">发送</button>
      </div>
    </section>

    <!-- Protocol log sidebar -->
    <aside class="log-panel">
      <div class="log-header">
        <span>📡</span> Protocol Flow
        <button onclick="clearLog()" style="margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:4px;cursor:pointer;font-size:10px">清空</button>
      </div>
      <div class="log-entries" id="log">
        <div id="log-empty" style="color:var(--muted);font-size:12px;text-align:center;padding:40px 16px">
          协议调用记录将在这里显示
        </div>
      </div>
      <div class="log-status">
        <div class="dot" id="log-dot"></div>
        <span id="log-status-text">等待中</span>
      </div>
    </aside>

  </div>
</div>

<script>
'use strict';

// ── State ─────────────────────────────────────────────────────────────────────
let busy = false;
const pendingPayments = {};  // payment_id → {checkout_id, token, amount, currency, product_name}

// ── Status ────────────────────────────────────────────────────────────────────
function setStatus(state, text) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  const ldot = document.getElementById('log-dot');
  const ltxt = document.getElementById('log-status-text');
  dot.className = 'dot ' + state;
  ldot.className = 'dot ' + state;
  txt.textContent = text;
  ltxt.textContent = text;
}

// ── Chat helpers ──────────────────────────────────────────────────────────────
function scrollChat() {
  const c = document.getElementById('chat');
  c.scrollTop = c.scrollHeight;
}

function addBubble(role, content, id) {
  const chat = document.getElementById('chat');
  const isUser = role === 'user';
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  if (id) el.id = id;
  el.innerHTML = `
    <div class="av">${isUser ? '👤' : '🤖'}</div>
    <div>
      <div class="bubble">
        <div class="role-label">${isUser ? 'You' : 'AI 助手'}</div>
        <div class="bubble-text" ${id ? `id="text-${id}"` : ''}>${esc(content)}</div>
      </div>
    </div>`;
  chat.appendChild(el);
  scrollChat();
  return el;
}

function addTypingIndicator() {
  const chat = document.getElementById('chat');
  const el = document.createElement('div');
  el.className = 'msg agent';
  el.id = 'typing-indicator';
  el.innerHTML = `
    <div class="av">🤖</div>
    <div>
      <div class="bubble">
        <div class="typing"><span></span><span></span><span></span></div>
      </div>
    </div>`;
  chat.appendChild(el);
  scrollChat();
  return el;
}

function removeTypingIndicator() {
  document.getElementById('typing-indicator')?.remove();
}

function addSpecialCard(role, titleEl, contentEl) {
  const chat = document.getElementById('chat');
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = `
    <div class="av">${role === 'user' ? '👤' : '💳'}</div>
    <div>
      <div class="bubble">
        <div class="role-label">${titleEl}</div>
        ${contentEl}
      </div>
    </div>`;
  chat.appendChild(el);
  scrollChat();
  return el;
}

function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Product catalog card ──────────────────────────────────────────────────────
const PRODUCT_EMOJIS = {
  'water': '💧', 'mineral': '💧', 'cola': '🥤', 'coke': '🥤', '可乐': '🥤',
  'tea': '🍵', '茶': '🍵', 'chips': '🍟', '薯片': '🍟', 'coffee': '☕',
  'juice': '🍊', 'beer': '🍺', 'milk': '🥛', 'energy': '⚡',
};
function productEmoji(name) {
  const n = name.toLowerCase();
  for (const [k, v] of Object.entries(PRODUCT_EMOJIS)) {
    if (n.includes(k)) return v;
  }
  return '🛒';
}

function addProductGrid(items) {
  const available = items.filter(i => i.quantity_available > 0);
  const unavailable = items.filter(i => i.quantity_available === 0);
  const allItems = [...available, ...unavailable];

  const chat = document.getElementById('chat');
  const el = document.createElement('div');
  el.className = 'msg agent';
  const grid = allItems.map(item => {
    const avail = item.quantity_available > 0;
    const price = item.price ? `¥${(item.price.amount / 100).toFixed(2)}` : '';
    return `<div class="prod-item${avail ? '' : ' unavail'}" onclick="${avail ? `buyItem('${esc(item.id)}','${esc(item.name)}')` : ''}">
      <div class="prod-emoji">${productEmoji(item.name)}</div>
      <div class="prod-name">${esc(item.name)}</div>
      <div class="prod-price">${price}</div>
      ${!avail ? '<div class="prod-stock">缺货</div>' : ''}
      <div class="prod-lane">${esc(item.id)}</div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="av">🤖</div>
    <div>
      <div class="bubble">
        <div class="role-label">商品目录</div>
        <div class="bubble-text" style="margin-bottom:10px">点击商品即可购买：</div>
        <div class="product-grid">${grid}</div>
      </div>
    </div>`;
  chat.appendChild(el);
  scrollChat();
}

function buyItem(laneId, name) {
  const inp = document.getElementById('input');
  inp.value = `帮我买 ${name}`;
  send();
}

// ── Payment card ──────────────────────────────────────────────────────────────
function addPaymentCard(pid, amount, currency, productName, googlePayConfig, alipayConfig) {
  const chat = document.getElementById('chat');
  const el = document.createElement('div');
  el.className = 'msg agent';
  const sym = currency === 'CNY' ? '¥' : '$';
  const amtStr = `${sym}${(amount / 100).toFixed(2)}`;

  const ap2Chips = `
    ${alipayConfig ? '<span class="ap2-chip">🔐 ACT/1.0</span>' : ''}
    <span class="ap2-chip">🛡️ AP2 Mandate</span>
    ${googlePayConfig ? '<span class="ap2-chip" style="color:#4285f4;border-color:#4285f4">G Pay</span>' : ''}`;

  el.innerHTML = `
    <div class="av">💳</div>
    <div>
      <div class="bubble pay-card" id="paycard-${pid}">
        <div class="pay-header"><span class="pay-icon">💳</span><span class="pay-title">支付确认</span></div>
        <div class="pay-row"><span>商品</span><span>${esc(productName)}</span></div>
        <div class="pay-row"><span>商家</span><span>WM800 自动贩卖机</span></div>
        <div class="pay-row"><span>协议</span><span>UCP AP2 2026-04-08</span></div>
        <div class="pay-total">
          <span class="pay-total-label">合计</span>
          <span><span class="pay-total-amount">${amtStr}</span><span class="pay-total-cur">${currency}</span></span>
        </div>
        <div class="ap2-chips">${ap2Chips}</div>
        <div class="pay-methods" id="paymethods-${pid}">
          ${alipayConfig ? `<button class="btn-method btn-alipay" onclick="payAlipay('${pid}',${amount},'${currency}',${JSON.stringify(esc(productName))},${JSON.stringify(alipayConfig)})">支 支付宝 AI付 · ACT/1.0</button>` : ''}
          ${googlePayConfig ? `<button class="btn-method btn-gpay" id="gpay-${pid}" onclick="payGPay('${pid}',${amount},'${currency}',${JSON.stringify(googlePayConfig)})">🟢 Google Pay</button>` : ''}
          <button class="btn-method btn-prepaid" onclick="payPrepaid('${pid}',this)">💸 预付 Token（测试）${amtStr}</button>
          <button class="btn-cancel" onclick="cancelPay('${pid}')">取消</button>
        </div>
        <div class="alipay-cashier" id="alipay-cashier-${pid}">
          <iframe id="alipay-frame-${pid}" src="about:blank"></iframe>
        </div>
      </div>
    </div>`;
  chat.appendChild(el);
  scrollChat();

  // Render official Google Pay button if SDK ready
  if (googlePayConfig && window._gpayClient) {
    renderGPayButton(pid, amount, currency, googlePayConfig);
  }
}

function disablePayCard(pid) {
  const card = document.getElementById(`paycard-${pid}`);
  if (card) { card.style.opacity = '.5'; card.style.pointerEvents = 'none'; }
}

// ── Order timeline card ───────────────────────────────────────────────────────
function addOrderCard(orderId, amount, product, events) {
  const chat = document.getElementById('chat');
  const el = document.createElement('div');
  el.className = 'msg agent';
  const timeline = events.map((ev, i) => `
    <div class="tl-item">
      <div class="tl-line">
        <div class="tl-dot"></div>
        ${i < events.length - 1 ? '<div class="tl-connector"></div>' : ''}
      </div>
      <div class="tl-name">${esc(ev)}</div>
    </div>`).join('');

  el.innerHTML = `
    <div class="av">📦</div>
    <div>
      <div class="bubble order-card">
        <div class="order-header"><span class="order-icon">✅</span><span class="order-title">出货完成</span></div>
        <div class="order-meta">
          <span>${esc(product)}</span>
          <span style="color:var(--green)">${amount}</span>
        </div>
        <div class="timeline">${timeline || '<div class="tl-name" style="color:var(--muted)">处理中…</div>'}</div>
        <div class="order-id">订单 ${esc(orderId)}</div>
      </div>
    </div>`;
  chat.appendChild(el);
  scrollChat();
}

// ── Payment methods ───────────────────────────────────────────────────────────
async function payPrepaid(pid, btn) {
  btn.disabled = true;
  btn.textContent = '处理中…';
  disablePayCard(pid);
  setStatus('thinking', '正在完成结账…');
  await doPhase2(pid, null, null, null);
}

async function payGPay(pid, amount, currency, cfg) {
  _initGPay();
  if (!window._gpayClient) { alert('Google Pay SDK 未加载'); return; }
  const req = {
    apiVersion: cfg.api_version || 2,
    apiVersionMinor: cfg.api_version_minor || 0,
    merchantInfo: { merchantId: cfg.merchant_info?.merchant_id || 'TEST', merchantName: cfg.merchant_info?.merchant_name || 'WM800' },
    allowedPaymentMethods: cfg.allowed_payment_methods || [{
      type: 'CARD',
      parameters: { allowedAuthMethods: ['PAN_ONLY','CRYPTOGRAM_3DS'], allowedCardNetworks: ['VISA','MASTERCARD'] },
      tokenizationSpecification: { type:'PAYMENT_GATEWAY', parameters: { gateway:'example', gatewayMerchantId:'exampleGatewayMerchantId' } },
    }],
    transactionInfo: { totalPriceStatus:'FINAL', totalPrice: (amount/100).toFixed(2), currencyCode: currency || 'CNY', countryCode:'CN' },
  };
  try {
    const data = await window._gpayClient.loadPaymentData(req);
    const token = data?.paymentMethodData?.tokenizationData?.token || 'gpay-mock';
    disablePayCard(pid);
    setStatus('thinking', 'Google Pay 授权中…');
    await doPhase2(pid, token, null, null);
  } catch (e) {
    if (e.statusCode !== 'CANCELED') {
      const b = document.getElementById(`gpay-${pid}`);
      if (b) { b.disabled = false; }
      addBubble('agent', `Google Pay 失败：${e.message || e.statusCode}`);
    }
  }
}

async function payAlipay(pid, amount, currency, product, cfg) {
  const pend = pendingPayments[pid] || {};
  const methods = document.getElementById(`paymethods-${pid}`);
  if (methods) Array.from(methods.querySelectorAll('button')).forEach(b => b.disabled = true);

  setStatus('thinking', '创建支付宝预下单…');
  const r = await fetch('/api/alipay-create-order', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ checkout_id: pend.checkout_id || '', amount, currency, product_name: product, token: pend.token }),
  });
  const order = await r.json();
  const cashierUrl = order.data?.cashier_url || order.cashier_url;
  const alipayOrderId = order.data?.alipay_order_id || order.alipay_order_id;
  if (!cashierUrl) {
    addBubble('agent', '支付宝预下单失败，请重试');
    if (methods) Array.from(methods.querySelectorAll('button')).forEach(b => b.disabled = false);
    return;
  }
  const cashierDiv = document.getElementById(`alipay-cashier-${pid}`);
  const frame = document.getElementById(`alipay-frame-${pid}`);
  cashierDiv.classList.add('show');
  frame.src = cashierUrl;
  setStatus('thinking', '等待支付确认…');

  window.addEventListener('message', async function handler(e) {
    if (e.data?.type !== 'alipay_paid') return;
    window.removeEventListener('message', handler);
    cashierDiv.classList.remove('show');
    disablePayCard(pid);
    setStatus('thinking', '支付宝已确认，完成结账…');
    await doPhase2(pid, null, e.data.alipay_order_id, e.data.intent_credential);
  });
}

function cancelPay(pid) {
  const card = document.getElementById(`paycard-${pid}`);
  card?.closest('.msg')?.remove();
  addBubble('agent', '已取消支付。如需重新购买，请再次告诉我。');
  setStatus('', '就绪');
}

// ── Google Pay SDK ────────────────────────────────────────────────────────────
let _gpayReady = false;
function _initGPay() {
  if (_gpayReady || !window.google?.payments?.api?.PaymentsClient) return;
  window._gpayClient = new google.payments.api.PaymentsClient({ environment: 'TEST' });
  _gpayReady = true;
}
function renderGPayButton(pid, amount, currency, cfg) {
  try {
    const btn = window._gpayClient.createButton({
      onClick: () => payGPay(pid, amount, currency, cfg),
      buttonType: 'pay', buttonColor: 'black',
    });
    btn.style.cssText = 'width:100%;border-radius:9px;overflow:hidden;margin-bottom:0';
    const old = document.getElementById(`gpay-${pid}`);
    old?.parentNode?.replaceChild(btn, old);
  } catch (e) { console.warn('GPay button render failed', e); }
}

// ── Phase 2: confirm payment ──────────────────────────────────────────────────
async function doPhase2(pid, gpayToken, alipayOrderId, intentCredential) {
  const agentMsgId = `agent-p2-${Date.now()}`;
  addBubble('agent', '', agentMsgId);
  let agText = '';

  await streamSSE(
    fetch('/api/confirm-payment', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ payment_id: pid, gpay_token: gpayToken || null, alipay_order_id: alipayOrderId || null, intent_credential: intentCredential || null }),
    }),
    {
      text: p => {
        agText += p.content;
        const el = document.getElementById(`text-${agentMsgId}`);
        if (el) el.textContent = agText;
        scrollChat();
      },
      tool_call: p => { setStatus('thinking', p.name + '…'); addLogEntry(p.id, p.name, p.args); },
      tool_result: p => { setStatus('thinking', `${p.name} → ${p.status}`); updateLogEntry(p.id, p.status, p.data); },
      ap2_mandate: p => { addLogEntry('ap2-' + Date.now(), 'ap2_mandate', p); },
      payment_done: p => {
        addOrderCard(p.order_id, p.amount, p.product, p.events || []);
      },
      done: _ => { setStatus('done', '完成 ✓'); setTimeout(() => setStatus('', '就绪'), 3000); busy = false; document.getElementById('send-btn').disabled = false; },
    }
  );
}

// ── Phase 1: chat ─────────────────────────────────────────────────────────────
async function send() {
  const inp = document.getElementById('input');
  const msg = inp.value.trim();
  if (!msg || busy) return;
  busy = true;
  inp.value = '';
  document.getElementById('send-btn').disabled = true;
  document.getElementById('suggestions').style.display = 'none';

  addBubble('user', msg);
  addTypingIndicator();
  setStatus('thinking', 'Agent 正在思考…');

  const agentMsgId = `agent-${Date.now()}`;
  let agText = '';
  let catalogShown = false;
  let agBubbleCreated = false;

  await streamSSE(
    fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg }),
    }),
    {
      text: p => {
        if (!agBubbleCreated) {
          removeTypingIndicator();
          addBubble('agent', '', agentMsgId);
          agBubbleCreated = true;
        }
        agText += p.content;
        const el = document.getElementById(`text-${agentMsgId}`);
        if (el) el.textContent = agText;
        scrollChat();
      },
      tool_call: p => {
        setStatus('thinking', p.name + '…');
        addLogEntry(p.id, p.name, p.args);
      },
      tool_result: p => {
        setStatus('thinking', `${p.name} → ${p.status}`);
        updateLogEntry(p.id, p.status, p.data);
        // Show catalog when browse_catalog result arrives
        if (p.name === 'ucp_browse_catalog' && p.status === 200 && p.data?.line_items && !catalogShown) {
          catalogShown = true;
          removeTypingIndicator();
          addProductGrid(p.data.line_items);
        }
      },
      payment_request: p => {
        removeTypingIndicator();
        setStatus('thinking', '等待支付确认…');
        pendingPayments[p.payment_id] = {
          pid: p.payment_id,
          checkout_id: p.checkout_id || '',
          token: p.token || '',
          amount: p.amount,
          currency: p.currency,
        };
        addPaymentCard(p.payment_id, p.amount, p.currency, p.product_name, p.google_pay, p.alipay);
        // Don't mark as not busy — we wait for user payment action
      },
      done: _ => {
        removeTypingIndicator();
        // If payment was requested, keep busy until phase 2 done
        if (!Object.keys(pendingPayments).length) {
          setStatus('done', '完成 ✓');
          setTimeout(() => setStatus('', '就绪'), 3000);
          busy = false;
          document.getElementById('send-btn').disabled = false;
        }
      },
    }
  );
}

function suggest(el) {
  document.getElementById('input').value = el.textContent;
  send();
}

// ── SSE streaming helper ──────────────────────────────────────────────────────
async function streamSSE(fetchPromise, handlers) {
  const resp = await fetchPromise;
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split('\n\n');
    buf = parts.pop() || '';
    for (const part of parts) {
      if (!part.trim()) continue;
      let ev = 'message', data = '';
      for (const line of part.split('\n')) {
        if (line.startsWith('event: ')) ev = line.slice(7).trim();
        if (line.startsWith('data: '))  data = line.slice(6);
      }
      if (!data) continue;
      try { handlers[ev]?.(JSON.parse(data)); } catch {}
    }
  }
}

// ── Protocol log ──────────────────────────────────────────────────────────────
const LOG_NAMES = {
  ucp_discover:        'GET /.well-known/ucp',
  ucp_get_token:       'POST /oauth/token',
  ucp_browse_catalog:  'POST /cart-sessions',
  ucp_create_checkout: 'POST /checkout-sessions',
  ucp_request_payment: '💳 Payment Request',
  ucp_complete_checkout:'POST /checkout-sessions/{id}/complete',
  ucp_track_order:     'GET /orders/{id}',
  ap2_mandate:         '🔐 AP2 Mandate',
};
const LOG_METHS = {
  ucp_discover: 'GET', ucp_get_token: 'POST', ucp_browse_catalog: 'POST',
  ucp_create_checkout: 'POST', ucp_request_payment: 'POST',
  ucp_complete_checkout: 'POST', ucp_track_order: 'GET',
  ap2_mandate: 'AP2',
};

function addLogEntry(id, name, args) {
  document.getElementById('log-empty')?.remove();
  const log = document.getElementById('log');
  const meth = LOG_METHS[name] || 'POST';
  const path = LOG_NAMES[name] || name;
  const el = document.createElement('div');
  el.className = 'log-entry';
  el.id = `le-${id}`;
  el.innerHTML = `
    <div class="le-head" onclick="this.parentElement.classList.toggle('open')">
      <span class="meth m${meth}">${meth}</span>
      <span class="le-path">${esc(path)}</span>
      <span class="calling" id="lb-${id}">calling…</span>
      <span class="le-arrow">▶</span>
    </div>
    <div class="le-body">
      <pre id="lbody-${id}">${args && Object.keys(args).length ? pjson(args) : '(no body)'}</pre>
    </div>`;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function updateLogEntry(id, status, data) {
  const badge = document.getElementById(`lb-${id}`);
  const body  = document.getElementById(`lbody-${id}`);
  if (badge) {
    const ok = status >= 200 && status < 300;
    badge.className = 'le-status ' + (ok ? 'ok' : 'err');
    badge.textContent = status;
  }
  if (body && data) body.innerHTML = pjson(data);
}

function clearLog() {
  document.getElementById('log').innerHTML = `
    <div id="log-empty" style="color:var(--muted);font-size:12px;text-align:center;padding:40px 16px">
      协议调用记录将在这里显示
    </div>`;
}

function pjson(obj) {
  try {
    return JSON.stringify(obj, null, 2)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"([^"]+)":/g, '<span style="color:#79c0ff">"$1"</span>:')
      .replace(/: "([^"]*)"/g, ': <span style="color:#a5d6ff">"$1"</span>')
      .replace(/: (\d+\.?\d*)/g, ': <span style="color:#f2cc60">$1</span>');
  } catch { return String(obj); }
}
