<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>🏪 AI 贩卖机</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090e1a;--panel:#0f1829;--border:#1e3a5f;--accent:#3b82f6;
  --accent2:#06b6d4;--text:#e2e8f0;--muted:#64748b;--green:#10b981;
  --red:#ef4444;--yellow:#f59e0b;
}
html,body{height:100%;font-family:-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--text)}

/* ── Layout ── */
.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:280px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;min-width:0}

/* ── Sidebar: machine selector ── */
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-title{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.machine-btn{width:100%;padding:10px 12px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text);text-align:left;cursor:pointer;margin-bottom:6px;transition:.15s;display:flex;align-items:center;gap:8px}
.machine-btn:hover{border-color:var(--accent);background:rgba(59,130,246,.08)}
.machine-btn.active{border-color:var(--accent);background:rgba(59,130,246,.15);color:#93c5fd}
.machine-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.machine-btn.active .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
.machine-name{font-size:13px;font-weight:600;line-height:1.2}
.machine-loc{font-size:11px;color:var(--muted);margin-top:2px}

/* ── Sidebar: catalog ── */
.catalog-section{flex:1;overflow-y:auto;padding:12px}
.catalog-title{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.catalog-empty{font-size:12px;color:var(--muted);padding:8px 0}
.catalog-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;margin-bottom:4px;cursor:pointer;transition:.12s;border:1px solid transparent}
.catalog-item:hover{background:rgba(59,130,246,.08);border-color:var(--border)}
.catalog-item.unavail{opacity:.4;cursor:default}
.catalog-item .item-name{font-size:12px;font-weight:500;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catalog-item .item-price{font-size:12px;color:var(--accent2);font-weight:700;white-space:nowrap}
.catalog-item .item-qty{font-size:10px;color:var(--muted);margin-top:2px}

/* ── Header ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel)}
.header-left{display:flex;align-items:center;gap:10px}
.header-icon{font-size:22px}
.header-title{font-size:15px;font-weight:800;color:#93c5fd}
.header-sub{font-size:11px;color:var(--muted)}
.header-right{display:flex;align-items:center;gap:10px}
.mode-badge{font-size:11px;background:rgba(6,182,212,.15);color:var(--accent2);border:1px solid rgba(6,182,212,.3);border-radius:20px;padding:3px 10px;font-weight:600}
.nav-link{font-size:12px;color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:6px;transition:.12s}
.nav-link:hover{color:var(--text);background:rgba(255,255,255,.06)}

/* ── Chat ── */
.chat-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-track{background:transparent}
.chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.msg{display:flex;gap:10px;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px}
.avatar.ai{background:linear-gradient(135deg,#1e40af,#0e7490)}
.avatar.user{background:linear-gradient(135deg,#374151,#1f2937)}
.bubble{max-width:75%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.6}
.msg.ai .bubble{background:var(--panel);border:1px solid var(--border);border-radius:4px 14px 14px 14px}
.msg.user .bubble{background:linear-gradient(135deg,#1e3a8a,#1e40af);border-radius:14px 4px 14px 14px}
.typing{display:flex;gap:4px;align-items:center;padding:10px 14px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* ── Order card ── */
.order-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:6px;font-size:13px}
.order-card .oc-title{font-weight:700;color:#93c5fd;margin-bottom:8px}
.order-card .oc-row{display:flex;justify-content:space-between;margin-bottom:4px;color:var(--muted)}
.order-card .oc-row span:last-child{color:var(--text);font-weight:600}
.qr-wrap{text-align:center;margin-top:10px}
.qr-code-box{display:inline-block;background:#fff;padding:8px;border-radius:8px;margin-bottom:6px}
.pickup-code{font-size:22px;font-weight:900;letter-spacing:4px;color:var(--accent2);font-family:monospace}

/* ── Input ── */
.input-bar{padding:14px 20px;border-top:1px solid var(--border);background:var(--panel)}
.input-row{display:flex;gap:10px;align-items:flex-end}
.input-wrap{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;display:flex;align-items:flex-end;gap:8px;transition:.15s}
.input-wrap:focus-within{border-color:var(--accent)}
textarea{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;resize:none;max-height:120px;line-height:1.5;font-family:inherit}
textarea::placeholder{color:var(--muted)}
.send-btn{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.send-btn:hover{opacity:.85}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}

/* ── Payment iframe ── */
.pay-frame-wrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:6px}
.pay-frame-wrap iframe{width:100%;height:460px;border:none;display:block}

/* ── Welcome screen ── */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px;text-align:center;gap:16px}
.welcome-icon{font-size:64px}
.welcome-title{font-size:20px;font-weight:800;color:#93c5fd}
.welcome-sub{font-size:14px;color:var(--muted);max-width:320px;line-height:1.6}
.welcome-tip{font-size:12px;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:8px 14px}

/* ── New chat btn ── */
.new-chat-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);border-radius:8px;color:#93c5fd;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.new-chat-btn:hover{background:rgba(59,130,246,.2)}

/* ── Payment confirm card ── */
.pay-confirm-card{background:var(--bg);border:1px solid rgba(59,130,246,.4);border-radius:12px;padding:14px;margin-top:8px;min-width:220px}
.pay-confirm-title{font-size:13px;font-weight:700;color:#93c5fd;margin-bottom:10px}
.pay-confirm-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.pay-confirm-row span:last-child{color:var(--text)}
.pay-confirm-amount{font-size:22px;font-weight:900;color:var(--text);text-align:center;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:10px 0}
.pay-confirm-btns{display:flex;flex-direction:column;gap:8px}
.pay-confirm-btn{padding:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:9px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.pay-confirm-btn:hover{opacity:.85}
.pay-confirm-btn:disabled{opacity:.4;cursor:not-allowed}
.pay-cancel-btn{padding:8px;background:transparent;border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:12px;cursor:pointer;transition:.15s}
.pay-cancel-btn:hover{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<div class="layout">

  <!-- ── Sidebar ── -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">选择贩卖机</div>
      <div id="machineList"></div>
    </div>
    <div class="catalog-section">
      <div class="catalog-title">商品目录</div>
      <div id="catalogList"><div class="catalog-empty">选择贩卖机后显示商品</div></div>
    </div>
  </div>

  <!-- ── Main ── -->
  <div class="main">
    <div class="header">
      <div class="header-left">
        <div class="header-icon">🏪</div>
        <div>
          <div class="header-title" id="machineTitle">AI 自动贩卖机</div>
          <div class="header-sub" id="machineLoc">选择一台贩卖机开始对话</div>
        </div>
      </div>
      <div class="header-right">
        <span class="mode-badge">贩卖机模式</span>
        <button class="new-chat-btn" onclick="newChat()">＋ 新对话</button>
        <a class="nav-link" href="/">在线购物</a>
        <a class="nav-link" href="/vending">📊 监控</a>
      </div>
    </div>

    <div id="chatArea" class="chat-area">
      <div class="welcome" id="welcomeScreen">
        <div class="welcome-icon">🤖</div>
        <div class="welcome-title">AI 贩卖机助手</div>
        <div class="welcome-sub">请在左侧选择您所在的贩卖机，然后直接告诉我您想买什么。</div>
        <div class="welcome-tip">💬 后期支持语音交互 — 对着贩卖机说话即可购物</div>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-row">
        <div class="input-wrap">
          <textarea id="msgInput" rows="1" placeholder="选择贩卖机后开始对话…" disabled
            onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="send()" disabled title="发送">➤</button>
      </div>
      <div class="hint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const AGENT = '';  // same origin
const SC    = 'https://supply-chain-mock.fxp007.workers.dev';
const UCP   = 'https://ucp-mock.fxp007.workers.dev';

let selectedMachine = null;
let threadId = crypto.randomUUID();
let userId = (() => {
  let id = sessionStorage.getItem('kiosk_uid');
  if (!id) { id = 'kiosk-' + crypto.randomUUID().slice(0,8); sessionStorage.setItem('kiosk_uid', id); }
  return id;
})();
let sending = false;
let pendingPayments = {};  // pid → payment_request payload

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Machines ──────────────────────────────────────────────────────────────────
async function loadMachines() {
  try {
    const r = await fetch(`${SC}/machines`);
    const machines = await r.json();
    const el = document.getElementById('machineList');
    el.innerHTML = '';
    machines.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'machine-btn';
      btn.innerHTML = `<div class="dot"></div><div><div class="machine-name">${m.name}</div><div class="machine-loc">${m.location}</div></div>`;
      btn.onclick = () => selectMachine(m, btn);
      el.appendChild(btn);
    });
    if (!machines.length) {
      el.innerHTML = '<div class="catalog-empty">暂无贩卖机</div>';
    }
  } catch(e) {
    document.getElementById('machineList').innerHTML = '<div class="catalog-empty">加载失败</div>';
  }
}

async function selectMachine(m, btn) {
  selectedMachine = m;
  document.querySelectorAll('.machine-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('machineTitle').textContent = m.name;
  document.getElementById('machineLoc').textContent = m.location;
  document.getElementById('msgInput').disabled = false;
  document.getElementById('msgInput').placeholder = `跟 ${m.name} 的 AI 助手说话…`;
  document.getElementById('sendBtn').disabled = false;
  newChat(false);  // fresh thread, no greeting yet
  loadCatalog(m.id);
}

async function loadCatalog(machineId) {
  const el = document.getElementById('catalogList');
  el.innerHTML = '<div class="catalog-empty">加载中…</div>';
  try {
    const r = await fetch(`${SC}/machines/${machineId}/inventory`);
    const inv = await r.json();
    if (!inv.length) { el.innerHTML = '<div class="catalog-empty">此机器暂无商品</div>'; return; }
    el.innerHTML = '';
    inv.forEach(item => {
      const avail = item.qty > 0;
      const div = document.createElement('div');
      div.className = 'catalog-item' + (avail ? '' : ' unavail');
      div.title = avail ? '点击快速询问' : '暂时缺货';
      div.innerHTML = `
        <div>
          <div class="item-name">${item.name}</div>
          <div class="item-qty">库存 ${item.qty}</div>
        </div>
        <div class="item-price">¥${(item.price_fen/100).toFixed(1)}</div>`;
      if (avail) div.onclick = () => quickAsk(item.name);
      el.appendChild(div);
    });
  } catch(e) {
    el.innerHTML = '<div class="catalog-empty">加载失败</div>';
  }
}

function quickAsk(name) {
  const ta = document.getElementById('msgInput');
  ta.value = `我想买${name}`;
  ta.focus();
  send();
}

// ── Chat ──────────────────────────────────────────────────────────────────────
function newChat(greet = true) {
  threadId = crypto.randomUUID();
  const area = document.getElementById('chatArea');
  if (!selectedMachine) {
    area.innerHTML = '<div class="welcome" id="welcomeScreen"><div class="welcome-icon">🤖</div><div class="welcome-title">AI 贩卖机助手</div><div class="welcome-sub">请在左侧选择您所在的贩卖机，然后直接告诉我您想买什么。</div><div class="welcome-tip">💬 后期支持语音交互 — 对着贩卖机说话即可购物</div></div>';
    return;
  }
  area.innerHTML = '';
  if (greet) {
    // Auto-send greeting to get machine context injected
    sendMessage(`你好！我在 ${selectedMachine.name}，帮我看看有什么可以买的`);
  }
}

function appendMsg(role, content) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const icon = role === 'ai' ? '🤖' : '👤';
  div.innerHTML = `<div class="avatar ${role}">${icon}</div><div class="bubble" id="bubble-${Date.now()}"></div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div.querySelector('.bubble');
}

function addTyping() {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg ai'; div.id = 'typing-indicator';
  div.innerHTML = `<div class="avatar ai">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}
function removeTyping() { document.getElementById('typing-indicator')?.remove(); }

function renderContent(el, text) {
  // Minimal markdown: bold, newlines
  el.innerHTML = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>');
}

function addOrderCard(el, data) {
  const card = document.createElement('div');
  card.className = 'order-card';
  const qrId = 'qr-' + Math.random().toString(36).slice(2,8);
  const code = data.pickup_code || '';
  const url  = data.pickup_url  || '';
  card.innerHTML = `
    <div class="oc-title">✅ 订单已生成</div>
    <div class="oc-row"><span>商品</span><span>${data.item_name || ''}</span></div>
    <div class="oc-row"><span>取货码</span><span class="pickup-code">${code}</span></div>
    ${url ? `<div class="qr-wrap"><div class="qr-code-box" id="${qrId}"></div><br><small style="color:var(--muted);font-size:11px">扫码取货</small></div>` : ''}
  `;
  el.appendChild(card);
  if (url) setTimeout(() => {
    try { new window.QRCode(document.getElementById(qrId), { text: url, width: 120, height: 120 }); } catch(e){}
  }, 50);
}

function addPayFrame(el, cashierUrl) {
  const wrap = document.createElement('div');
  wrap.className = 'pay-frame-wrap';
  wrap.innerHTML = `<iframe src="${cashierUrl}" allow="payment"></iframe>`;
  el.appendChild(wrap);
  window.addEventListener('message', function handler(e) {
    if (e.data?.type === 'alipay_paid') {
      wrap.remove();
      window.removeEventListener('message', handler);
      const bubble = appendMsg('ai', '');
      renderContent(bubble, '✅ 支付成功！正在完成出货…');
    }
  });
}

// ── Send ──────────────────────────────────────────────────────────────────────
function send() {
  const ta = document.getElementById('msgInput');
  const msg = ta.value.trim();
  if (!msg || sending || !selectedMachine) return;
  ta.value = ''; ta.style.height = '';
  sendMessage(msg);
}

async function sendMessage(msg) {
  if (sending) return;
  sending = true;
  document.getElementById('sendBtn').disabled = true;

  appendMsg('user', '').innerHTML = msg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  addTyping();

  try {
    const resp = await fetch(`${AGENT}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: msg,
        user_id: userId,
        thread_id: threadId,
        machine_id: selectedMachine?.id || '',
      }),
    });

    removeTyping();
    const bubble = appendMsg('ai', '');
    let text = '';
    let orderData = null;
    let cashierUrl = null;

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let curEvent = '';   // tracks current SSE event type

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (line.startsWith('event:')) {
          curEvent = line.slice(6).trim();
          continue;
        }
        if (!line.startsWith('data:')) continue;
        const raw = line.slice(5).trim();
        if (!raw) continue;
        try {
          const payload = JSON.parse(raw);
          if (curEvent === 'text' && payload.content) {
            text += payload.content;
            renderContent(bubble, text);
            document.getElementById('chatArea').scrollTop = 99999;
          } else if (curEvent === 'payment_request') {
            pendingPayments[payload.payment_id] = payload;
            if (!text) renderContent(bubble, '💳 请确认支付');
            showPaymentCard(payload, bubble);
            document.getElementById('chatArea').scrollTop = 99999;
          } else if (curEvent === 'payment_done') {
            orderData = payload;
          } else if (curEvent === 'cashier_url') {
            cashierUrl = payload.cashier_url;
          }
        } catch(e) {}
        curEvent = '';
      }
    }

    if (cashierUrl) addPayFrame(bubble, cashierUrl);
    if (orderData) {
      addOrderCard(bubble, orderData);
      // Reload catalog after purchase
      if (selectedMachine) loadCatalog(selectedMachine.id);
    }
  } catch(e) {
    removeTyping();
    appendMsg('ai', '').innerHTML = '❌ 连接失败，请重试';
  } finally {
    sending = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}
function autoResize(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
}

// ── Payment ───────────────────────────────────────────────────────────────────
function showPaymentCard(p, bubble) {
  const pid = p.payment_id;
  const sym = p.currency === 'CNY' ? '¥' : '$';
  const amtStr = `${sym}${(p.amount / 100).toFixed(2)}`;
  const card = document.createElement('div');
  card.className = 'pay-confirm-card';
  card.id = `paycard-${pid}`;
  card.innerHTML = `
    <div class="pay-confirm-title">💳 支付确认</div>
    <div class="pay-confirm-row"><span>商品</span><span>${escHtml(p.product_name || '')}</span></div>
    <div class="pay-confirm-row"><span>金额</span><span>${escHtml(p.currency)}</span></div>
    <div class="pay-confirm-amount">${escHtml(amtStr)}</div>
    <div class="pay-confirm-btns">
      <button class="pay-confirm-btn" id="paybtn-${escHtml(pid)}" onclick="confirmKioskPay('${escHtml(pid)}')">确认支付 ${escHtml(amtStr)}</button>
      <button class="pay-cancel-btn" onclick="cancelKioskPay('${escHtml(pid)}')">取消</button>
    </div>`;
  bubble.appendChild(card);
}

async function confirmKioskPay(pid) {
  const p = pendingPayments[pid];
  if (!p) return;
  const btn = document.getElementById(`paybtn-${pid}`);
  if (btn) { btn.disabled = true; btn.textContent = '处理中…'; }

  const bubble2 = appendMsg('ai', '');
  renderContent(bubble2, '⏳ 正在完成结账…');

  try {
    const resp = await fetch(`${AGENT}/api/confirm-payment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        payment_id: pid,
        user_id: userId,
        gpay_token: null,
        alipay_order_id: null,
        intent_credential: null,
      }),
    });

    const reader2 = resp.body.getReader();
    const dec2 = new TextDecoder();
    let buf2 = '', curEv2 = '', text2 = '';

    while (true) {
      const { done, value } = await reader2.read();
      if (done) break;
      buf2 += dec2.decode(value, { stream: true });
      const lines2 = buf2.split('\n');
      buf2 = lines2.pop();
      for (const ln of lines2) {
        if (ln.startsWith('event:')) { curEv2 = ln.slice(6).trim(); continue; }
        if (!ln.startsWith('data:')) continue;
        const raw2 = ln.slice(5).trim();
        if (!raw2) continue;
        try {
          const pl2 = JSON.parse(raw2);
          if (curEv2 === 'text' && pl2.content) {
            text2 += pl2.content;
            renderContent(bubble2, text2);
            document.getElementById('chatArea').scrollTop = 99999;
          } else if (curEv2 === 'payment_done') {
            addOrderCard(bubble2, pl2);
            if (selectedMachine) loadCatalog(selectedMachine.id);
            // Auto-reset kiosk after 15s
            setTimeout(() => newChat(false), 15000);
          }
        } catch(e) {}
        curEv2 = '';
      }
    }
  } catch(e) {
    renderContent(bubble2, '❌ 支付失败，请重试');
  }
  delete pendingPayments[pid];
}

function cancelKioskPay(pid) {
  document.getElementById(`paycard-${pid}`)?.remove();
  delete pendingPayments[pid];
  const b = appendMsg('ai', '');
  renderContent(b, '已取消支付。需要购买请再告诉我。');
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadMachines();
</script>
